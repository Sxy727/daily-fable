# 每日文章生成定时任务（阶段 2）
# 每天北京时间 00:38 自动运行一次，也可在 GitHub 网页上手动触发。
# 密钥：DEEPSEEK_API_KEY 需预先配置在仓库 Settings → Secrets 中。

name: 每日文章生成

on:
  schedule:
    # UTC 16:38 = 北京时间 00:38（避开整点，错峰运行）
    - cron: "38 16 * * *"
  workflow_dispatch: {}   # 支持手动触发（用于测试和补跑）

permissions:
  contents: write          # 允许把生成的文章提交回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成今日文章
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate.py

      - name: 提交文章到仓库
        run: |
          git config user.name "daily-fable-bot"
          git config user.email "daily-fable-bot@users.noreply.github.com"
          git add content/
          git commit -m "自动生成 $(TZ=Asia/Shanghai date +%F) 文章" || echo "没有新内容"
          git push
